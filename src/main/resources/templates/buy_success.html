<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
    <meta charset="UTF-8"/>
    <title>Cart Page</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>


<nav class="navbar navbar-expand-lg navbar-light fixed-top">
    <div class="container">
        <a class="navbar-brand" href="#">Bojana's Place Games</a>

        <button class="navbar-toggler" type="button"
                data-toggle="collapse"
                data-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ml-auto">

                <li class="nav-item active">
                    <a class="nav-link" th:href="@{/}" th:text="#{home}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" sec:authorize="isAuthenticated()"
                       th:href="@{/shop}" th:text="#{shop}">Shop</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" sec:authorize="hasRole('ROLE_ADMIN')"
                       th:href="@{/admin/game/list}" th:text="#{gameList}">Games List</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" sec:authorize="hasRole('ROLE_ADMIN')"
                       th:href="@{/admin/user/list}" th:text="#{userList}">User List</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" sec:authorize="isAuthenticated()"
                       th:href="@{/logout}" th:text="#{logout}">Logout</a>
                </li>

            </ul>
        </div>
    </div>
</nav>



<div class="shop-page-bg">

    <div class="container table-wrapper">

        <table class="table table-borderless table-dark table-overlay">
            <thead>
            <tr>
                <th>#</th>
                <th th:text="#{title}"></th>
                <th th:text="#{price}"></th>
                <th th:text="#{quiantity}"></th>
                <th th:text="#{total}"></th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="item : ${session.shoppingCart.items}">
                <td th:text="${item.product.idGame}"></td>
                <td th:text="${item.product.title}"></td>

                <td>
                    Rs.<span th:text="${item.product.price}"></span>
                </td>

                <td>
                    <form th:action="@{/cart/update}" method="post">
                        <input type="hidden"
                               th:value="${item.product.idGame}"
                               name="id"/>
                        <input type="number"
                               min="1"
                               th:value="${item.quantity}"
                               name="qty"
                               class="form-control"
                               style="width:80px;">
                    </form>
                </td>

                <td>
                    Rs.<span th:text="${item.subTotal}"></span>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="text-center mt-4">
            <label th:text="#{buy}" style="font-size: 30pt;"></label>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
