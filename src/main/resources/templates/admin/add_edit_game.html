<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
    <meta charset="UTF-8"/>
    <title>Add/Edit Game</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>


<nav class="navbar navbar-expand-lg navbar-light fixed-top">
    <div class="container">
        <a class="navbar-brand" href="#">Bojana's Place Games</a>

        <button class="navbar-toggler" type="button"
                data-toggle="collapse"
                data-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ml-auto">

                <li class="nav-item active">
                    <a class="nav-link" th:href="@{/}" th:text="#{home}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" sec:authorize="isAuthenticated()"
                       th:href="@{/shop}" th:text="#{shop}">Shop</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" sec:authorize="isAuthenticated()"
                       th:href="@{/admin/game/list}" th:text="#{gameList}">Games List</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" sec:authorize="isAuthenticated()"
                       th:href="@{/admin/user/list}" th:text="#{userList}">User List</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" sec:authorize="isAuthenticated()"
                       th:href="@{/logout}" th:text="#{logout}">Logout</a>
                </li>

            </ul>
        </div>
    </div>
</nav>



<div class="admin-page-bg">


    <div class="container form-wrapper">

        <div class="form-overlay p-4">

            <form th:action="@{/admin/game/addEdit}"
                  method="post"
                  th:object="${game}">

                <label th:text="#{title}"></label>
                <input type="text"
                       class="form-control form-control-lg"
                       th:field="*{title}"
                       th:placeholder="#{title}"/>
                <br/>

                <label th:text="#{releaseYear}"></label>
                <input type="text"
                       class="form-control form-control-lg"
                       th:field="*{releaseYear}"
                       th:placeholder="#{releaseYear}"/>
                <br/>

                <label th:text="#{genre}"></label>
                <input type="text"
                       class="form-control form-control-lg"
                       th:field="*{genre}"
                       th:placeholder="#{genre}"/>

                <label th:text="#{quiantity}"></label>
                <input type="text"
                       class="form-control form-control-lg"
                       th:field="*{quantity}"
                       th:placeholder="#{quiantity}"/>

                <label th:text="#{price}"></label>
                <input type="text"
                       class="form-control form-control-lg"
                       th:field="*{price}"
                       th:placeholder="#{price}"/>

                <input type="hidden" th:field="*{idGame}">
                <br/>

                <button type="submit" class="btn btn-info btn-lg">
                    Submit
                </button>

            </form>

        </div>
    </div>
</div>


<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
